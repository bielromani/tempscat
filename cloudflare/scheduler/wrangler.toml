# El reloj de la ingesta. El por qué está en worker.js.
#
# Despliegue:  cd cloudflare/scheduler && npx wrangler deploy
# El secreto:  npx wrangler secret put GITHUB_TOKEN
#
# Se despliega desde aquí y no desde el panel a propósito: pegar el código en
# el editor de Cloudflare hace que lo que corre y lo que está versionado se
# separen sin que nadie se entere. Los pasos, en docs/13-full-de-ruta.md.

name = "tempscat-scheduler"
main = "worker.js"
compatibility_date = "2026-09-01"

# Sin URL pública. Este worker no tiene manejador HTTP — solo un reloj — así
# que no hay nada que publicar en workers.dev.
#
# Ojo, que no exime de nada: **la cuenta necesita tener registrado su
# subdominio de workers.dev igualmente**, porque sin él la API de Cloudflare
# rechaza registrar cron triggers — `code: 10063`, y el mensaje habla de
# publicar, que es lo que hace pensar que esta línea lo evita. Se crea una sola
# vez abriendo el menú de Workers en el panel. Con eso hecho, esta línea sigue
# haciendo su trabajo: el worker no queda accesible desde fuera.
workers_dev = false

[vars]
GITHUB_REPO = "bielromani/tempscat"

# Uno solo, y la decisión de qué toca a cada hora está en worker.js.
#
# El plan gratuito permite tres por worker y hacen falta cinco horarios
# distintos. Con un tic cada cinco minutos sobran dos, y encima la predicción
# se puede disparar con el nivel puesto en vez de deducirlo de la hora.
[triggers]
crons = ["*/5 * * * *"]
