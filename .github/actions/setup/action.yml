name: Preparar l'entorn
description: Node i dependències. El codi ja hi ha de ser.

# El `checkout` NO pot anar aquí. Una acció local es carrega des del disc del
# servidor, així que el repositori ha d'estar-hi abans de poder-la usar: posar
# el checkout dins seu és demanar-li que es trobi a si mateixa. Cada workflow fa
# el checkout primer i després crida això.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        # La mateixa versió que en local. Node executa el TypeScript directament,
        # sense pas de compilació, i això depèn de la versió.
        node-version: '24'
        cache: npm

    # `npm ci` i no `npm install`: instal·la exactament el que diu el
    # package-lock.json i falla si no hi encaixa. En una execució automàtica no
    # hi ha ningú per adonar-se que ha entrat una versió nova d'alguna cosa.
    - run: npm ci
      shell: bash

    # Diu en una línia si el codi de publicació arrenca de debo.
    #
    # La primera execucio va morir amb `Cannot find package '@vercel/blob'`
    # despres que `npm ci` digues que tot havia anat be, i des de fora no hi
    # havia manera de saber si el paquet hi era o no. Aquell paquet ja no hi
    # es -R2 es firma amb `node:crypto` i prou- pero la comprovacio val igual:
    # carrega el modul que puja els fitxers, que es l'ultim que fa un worker i
    # el pitjor lloc per descobrir que no arrenca.
    - name: Comprovar que el codi de publicacio carrega
      shell: bash
      run: |
        node --input-type=module -e "
          const { putObject, s3Config } = await import('./scripts/lib/s3.ts');
          if (typeof putObject !== 'function') throw new Error('s3.ts carregat pero sense putObject()');
          if (typeof s3Config !== 'function') throw new Error('s3.ts carregat pero sense s3Config()');
          console.log('publicacio a R2: modul carregat');
        "
