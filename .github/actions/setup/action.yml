name: Preparar l'entorn
description: Node i dependències. El codi ja hi ha de ser.

# El `checkout` NO pot anar aquí. Una acció local es carrega des del disc del
# servidor, així que el repositori ha d'estar-hi abans de poder-la usar: posar
# el checkout dins seu és demanar-li que es trobi a si mateixa. Cada workflow fa
# el checkout primer i després crida això.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        # La mateixa versió que en local. Node executa el TypeScript directament,
        # sense pas de compilació, i això depèn de la versió.
        node-version: '24'
        cache: npm

    # `npm ci` i no `npm install`: instal·la exactament el que diu el
    # package-lock.json i falla si no hi encaixa. En una execució automàtica no
    # hi ha ningú per adonar-se que ha entrat una versió nova d'alguna cosa.
    - run: npm ci
      shell: bash

    # Diu en una línia si el codi de publicació arrenca de debo.
    #
    # La primera execucio va morir amb `Cannot find package '@vercel/blob'`
    # despres que `npm ci` digues que tot havia anat be, i des de fora no hi
    # havia manera de saber si el paquet hi era o no. Aquell paquet ja no hi
    # es -R2 es firma amb `node:crypto` i prou- pero la comprovacio val igual:
    # carrega el modul que puja els fitxers, que es l'ultim que fa un worker i
    # el pitjor lloc per descobrir que no arrenca.
    - name: Comprovar que el codi de publicacio carrega
      shell: bash
      run: |
        node --input-type=module -e "
          const { putObject, s3Config } = await import('./scripts/lib/s3.ts');
          if (typeof putObject !== 'function') throw new Error('s3.ts carregat pero sense putObject()');
          if (typeof s3Config !== 'function') throw new Error('s3.ts carregat pero sense s3Config()');
          console.log('publicacio a R2: modul carregat');
        "

    # I que sharp arrenca, que es l'altra cosa que pot fallar despres d'un
    # `npm ci` en verd.
    #
    # Es un modul natiu: el paquet que porta el binari depen del sistema
    # -`@img/sharp-linux-x64` aqui, un altre a Windows- i el lockfile ja ha
    # tingut aquest problema una vegada, quan un `npm install` sol va podar les
    # entrades d'`@emnapi` i `npm ci` es va quedar sense poder installar-lo a
    # Linux. Nomes el fa servir el worker de cameres, i descobrir-ho a mitja
    # baixada de vint-i-quatre fotogrames no serveix de res.
    - name: Comprovar que sharp arrenca
      shell: bash
      run: |
        node --input-type=module -e "
          const sharp = (await import('sharp')).default;
          const png = await sharp({ create: { width: 4, height: 4, channels: 3, background: '#000' } }).png().toBuffer();
          if (!png.length) throw new Error('sharp carregat pero sense poder codificar');
          console.log('sharp ' + sharp.versions.sharp + ': funciona');
        "

    # Quina configuracio de publicacio hi ha, sense ensenyar-ne cap valor.
    #
    # Els workers es planten a l'arrencada si els falta alguna -i han de
    # plantar-se: sense magatzem el que escriuen no va enlloc i la quota
    # gastada no es recupera-. Pero "Run failed" en un correu no diu quina, i
    # secrets i variables son dos calaixos que s'assemblen prou per pegar un
    # valor al que no toca. Aixi surt a les primeres linies del registre.
    #
    # A "Comprovacions" surten totes com a absents, i es correcte: aquell
    # treball no publica res.
    - name: Configuracio de publicacio
      shell: bash
      run: |
        for v in R2_ACCOUNT_ID R2_BUCKET R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY DATA_BASE_URL; do
          if [ -n "${!v}" ]; then echo "  hi es    $v"; else echo "  ABSENT   $v"; fi
        done
