name: Tessel·les de relleu

# A mà i prou. L'altitud del terreny no canvia.
#
# Es corre quan es toca el càlcul de l'ombrejat o quan cal ampliar la piràmide
# de zooms. Es baixa el terreny d'AWS, calcula les 2.645 tessel·les i les puja
# a l'emmagatzematge; les que ja hi són al disc de l'executor no es tornen a
# calcular, però com que cada execució arrenca amb un contenidor net, a la
# pràctica es calculen totes.
#
# ## Per què no es corre en local
#
# Perquè des de la màquina de desenvolupament **no s'hi pot publicar**. La
# connexió a R2 passa per una intercepció TLS i Node rebutja el certificat:
# `self-signed certificate`. La primera provatura va acabar amb totes les
# pujades en `fetch failed` i zero fitxers publicats — i el missatge d'aquell
# error no diu «certificat», així que va semblar una caiguda de xarxa fins que
# es va provar la connexió a pèl.
#
# `--use-system-ca` tampoc no ho resol: l'arrel corporativa no és al magatzem de
# Windows. I desactivar la verificació no és una opció.
#
# La intercepció va a estones: una hora més tard, la mateixa ordre va publicar
# 2.315 tessel·les del mapa base sense una queixa. Per això la publicació viu
# aquí i no depèn de com estigui la xarxa de qui hi treballa.
#
# El càlcul sí que es pot fer en local —les tessel·les queden a `data/cache/`— i
# el web les serveix del disc mentre s'hi treballa.
on:
  # Quan canvia el calcul de l'ombrejat, les tessel·les publicades ja no son
  # les que aquest codi faria. No es una drecera per llancar-ho: es la condicio
  # exacta en que s'han de refer.
  push:
    branches: [main]
    paths:
      - 'scripts/13-relief-tiles.ts'
      - '.github/workflows/relleu.yml'
  workflow_dispatch:

concurrency:
  group: relleu
  cancel-in-progress: false

jobs:
  tessel-les:
    runs-on: ubuntu-latest
    # Baixar 1.949 tessel·les de terreny i pujar-ne 1.949 de calculades.
    timeout-minutes: 60
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || vars.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || vars.R2_SECRET_ACCESS_KEY }}
      DATA_BASE_URL: ${{ secrets.DATA_BASE_URL || vars.DATA_BASE_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: npm run data:relleu
