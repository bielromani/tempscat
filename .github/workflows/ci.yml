name: Comprovacions

# Els dos projectes de TypeScript, el lint i les proves. En cada canvi.
#
# Importa més del que sembla en aquest repositori: `scripts/` i `src/` es
# comproven per separat perquè Node executa el TypeScript dels scripts esborrant
# els tipus, sense transformar-los, i això prohibeix construccions que la
# configuració de l'aplicació sí que accepta.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  comprovar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      # Primer de tot: que el lockfile serveixi a Linux i no només a Windows.
      # Si aixo falla, tota la ingesta automatica esta parada.
      - run: npm run check:lockfile
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      # Que compili sense dades és una comprovació de veritat: en un desplegament
      # nou el magatzem pot ser buit, i el lloc ha de sortir igualment amb el
      # territori sencer i cada buit dit en veu alta.
      #
      # ALLOW_NO_DATA ho diu explícitament perquè «magatzem buit» i «sense
      # magatzem ni disc» no són el mateix: el segon és una avería i des d'ara
      # peta. Sense aquesta variable no hi hauria manera de provar el primer.
      - run: npm run build
        env:
          ALLOW_NO_DATA: '1'
