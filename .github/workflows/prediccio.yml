name: Predicció

# ── El pressupost, que és qui decideix aquest fitxer ────────────────────────
#
# Open-Meteo factura **ubicacions**, no peticions, i el sostre que apreta no és
# el diari (10.000) sinó el **mensual: 300.000**, que surt a 10.000/dia de
# mitjana. Amb els punts d'avui i el repartiment de models per nivell:
#
#     A  350 punts × 3 models                    = 1.225 unitats per volta
#     B  1.679 punts, i AROME als 438 de 500 m amunt = 2.957 unitats per volta
#     C  1.161 punts, i AROME als 730 de 500 m amunt = 2.472 unitats per volta
#     i amb A, el model a les 189 estacions           =   189 unitats per volta
#     (la temperatura d'ara de les fitxes: `src/lib/now-temperature.ts`; el
#     `best_match` costa 1,5 per punt des que la sensació i el punt de rosada
#     es calculen en comptes de demanar-los)
#
# D'aquí surten les quatre hores de sota: **A dues vegades al dia, B i C una**.
#
#     2 × (1.225 + 189) + 2.957 + 2.472 = 8.257/dia = 248.000/mes = 83 % del sostre
#
# El 17 % que queda no és marge de sobres: és el que permet un `--fill` després
# d'un tall de xarxa sense passar-se de la ratlla.
#
# **Per què A i no B o C més sovint.** Els 350 punts del nivell A cobreixen les
# ubicacions més consultades, i són els únics que reben tres models —el consens
# entre ells és el que fa que la predicció valgui alguna cosa. Refrescar 1.679
# punts de nivell B dues vegades al dia costaria el doble i canviaria molt poc:
# una predicció a set dies no es mou gaire en dotze hores.
#
# ── Per què no van totes de matinada ────────────────────────────────────────
#
# Hi ha un límit **per hora** de 5.000 unitats, i B (3.190) més C (2.206) en
# sumen 5.396. Junts en la mateixa hora, el worker es quedaria esperant que
# caduqui la finestra. Per això B i C van amb hora i mitja de separació.
#
# Les hores són UTC: a l'estiu, dues més aquí.
on:
  schedule:
    - cron: '0 2 * * *'     # nivell B · 04:00 d'aquí a l'estiu
    - cron: '30 3 * * *'    # nivell C · 05:30
    - cron: '0 5 * * *'     # nivell A · 07:00, per al matí
    - cron: '0 17 * * *'    # nivell A · 19:00, per a l'endemà
  workflow_dispatch:
    inputs:
      tiers:
        description: 'Nivells a refrescar'
        default: 'A'
        type: choice
        options: ['A', 'B', 'C', 'A,B,C']
      fill:
        description: 'Només els punts que falten (barat)'
        type: boolean
        default: false

# Aquí sí que importa de debò: dues execucions alhora es gastarien la quota
# dues vegades per demanar exactament el mateix.
concurrency:
  group: prediccio
  cancel-in-progress: false

jobs:
  refresc:
    runs-on: ubuntu-24.04
    # El nivell B són nou lots amb pauses derivades del cost. Amb marge.
    timeout-minutes: 90
    env:
      # Secret o variable, indiferent. Els dos calaixos de GitHub s'assemblen
      # prou perque un valor acabi al que no toca, i llavors l'expressio surt
      # buida: el worker es planta a l'arrencada i no diu per que. Va passar.
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || vars.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || vars.R2_SECRET_ACCESS_KEY }}
      DATA_BASE_URL: ${{ secrets.DATA_BASE_URL || vars.DATA_BASE_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - name: Quins nivells toquen
        id: pla
        run: |
          case "${{ github.event.schedule }}" in
            '0 2 * * *')  tiers=B ;;
            '30 3 * * *') tiers=C ;;
            *)            tiers=A ;;
          esac
          # En execució manual mana el que s'hagi triat.
          if [ -n "${{ inputs.tiers }}" ]; then tiers="${{ inputs.tiers }}"; fi
          echo "tiers=$tiers" >> "$GITHUB_OUTPUT"
          echo "Refrescant el nivell $tiers"

      - run: npm run worker:forecast -- --tiers=${{ steps.pla.outputs.tiers }} ${{ inputs.fill && '--fill' || '' }}

      # Si algun lot s'ha perdut per la xarxa, això recupera **només** els punts
      # que falten. Rellançar el nivell sencer costaria milers d'unitats per
      # recuperar-ne dos-cents.
      - name: Recuperar el que hagi caigut
        if: success()
        run: npm run worker:forecast -- --tiers=${{ steps.pla.outputs.tiers }} --fill

      # El camp de vent del mapa, que surt d'aquesta mateixa predicció.
      #
      # `camp.yml` ja el torna a fer cada hora; va també aquí perquè la
      # predicció nova arribi al mapa quan existeix, i no a la volta següent.
      #
      # I va **després** del recobriment: fent-lo abans, un lot perdut sortiria
      # al mapa com una comarca sense vent, que és pitjor que sortir tard.
      - name: Calcular el camp de vent
        if: success()
        run: npm run worker:field
