name: Rècords, aire i aigua

# Un cop al dia, de matinada, i cada font per la seva raó:
#
#  · **Rècords i normals** (XEMA). El dataset diari porta dos dies de retard,
#    així que demanar-lo més sovint no avança res.
#  · **Qualitat de l'aire i pol·len** (CAMS). Té comptador propi a Open-Meteo,
#    i es demana per cel·la de 0,1° — 372 en comptes de 3.190 punts.
#  · **Aire mesurat** (XVPCA). Es publica un cop al dia de matinada i porta ~20 h
#    de retard: és la mesura d'*ahir*, i així es presenta.
#  · **Embassaments i cabals** (ACA). La lectura és de les 03:30, però el portal
#    no la publica fins a les 07:10 UTC: per això aquest workflow va a les 08:00.
#
# Va després de la predicció del nivell C perquè cap d'aquestes toca el
# comptador de predicció, però sí que competeixen pel temps del servidor.
on:
  schedule:
    # 10:00 d'aquí a l'estiu. Després de les 07:10 UTC, que és quan l'ACA
    # publica la lectura del dia; el rellotge de Cloudflare dispara a la mateixa hora.
    - cron: '0 8 * * *'
  workflow_dispatch:

concurrency:
  group: diari
  cancel-in-progress: false

jobs:
  ingesta:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Secret o variable, indiferent. Els dos calaixos de GitHub s'assemblen
      # prou perque un valor acabi al que no toca, i llavors l'expressio surt
      # buida: el worker es planta a l'arrencada i no diu per que. Va passar.
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || vars.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || vars.R2_SECRET_ACCESS_KEY }}
      DATA_BASE_URL: ${{ secrets.DATA_BASE_URL || vars.DATA_BASE_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      # Cadascuna amb `always()`: són quatre fonts independents i que una
      # caigui no és motiu per deixar el web sense les altres tres.
      - run: npm run worker:history
      - run: npm run worker:air
        if: always()
      - run: npm run worker:air-stations
        if: always()
      - run: npm run worker:water
        if: always()

      # La temperatura d'ara de les fitxes contra la dels models, hora a hora
      # del dia d'ahir. Aquesta sí que es pot fer cap enrere —Open-Meteo guarda
      # el que deia cada model per a cada hora—, així que el primer cop, o quan
      # canvia la llista de fonts, recupera trenta dies d'una volta (unes 430
      # unitats de quota, un cop). Després, unes 190 al dia.
      - run: npm run worker:compare
        if: always()

  # L'encert de cada model, comprovat contra el que han mesurat les estacions.
  # Llegeix la predicció que el refresc de les 05:00 ha deixat i les mesures
  # d'ahir que ja ha publicat el worker d'observació: no depèn de res de la
  # feina d'abans, i per això va al costat i no darrere.
  #
  # El resultat no serveix per a res fins d'aquí a dos mesos, i corre igual: un
  # historial de comparacions no es pot construir cap enrere, perquè la
  # predicció d'ahir ja no existeix enlloc.
  #
  # Des del 5 de novembre de 2026 també desa la predicció municipal de l'AEMET
  # al costat de la de la fitxa, per comparar-les amb les mateixes estacions.
  # L'AEMET deixa fer set municipis per minut, i són 138: uns 23 minuts, que és
  # el motiu de la feina a part. Sense la clau, ho salta i puntua els models.
  # Hi ha també yr.no, sense clau, en un minut, i el Meteocat, que només corre
  # si hi ha METEOCAT_API_KEY: el workflow l'ha de passar o per al worker no
  # existeix.
  encert:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || vars.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || vars.R2_SECRET_ACCESS_KEY }}
      DATA_BASE_URL: ${{ secrets.DATA_BASE_URL || vars.DATA_BASE_URL }}
      AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
      METEOCAT_API_KEY: ${{ secrets.METEOCAT_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: npm run worker:verify
