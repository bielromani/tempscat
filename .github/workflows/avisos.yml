name: Avisos oficials

# Cada 15 minuts, i és la cadència que més es nota.
#
# La pàgina d'avisos es revalida cada cinc minuts perquè, en un episodi, un
# quart d'hora de retard en la pàgina que es consulta *perquè* hi ha un avís
# són quinze minuts de més. No té sentit revalidar tan sovint si la ingesta va
# molt més lenta.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: avisos
  cancel-in-progress: false

jobs:
  ingesta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      DATA_BASE_URL: ${{ vars.DATA_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run worker:warnings
