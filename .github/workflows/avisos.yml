name: Avisos oficials

# Cada 15 minuts, i és la cadència que més es nota.
#
# La pàgina d'avisos es revalida cada cinc minuts perquè, en un episodi, un
# quart d'hora de retard en la pàgina que es consulta *perquè* hi ha un avís
# són quinze minuts de més. No té sentit revalidar tan sovint si la ingesta va
# molt més lenta.
on:
  schedule:
    # Aquest cron és la **xarxa de seguretat**, no el rellotge.
    #
    # El planificador de GitHub no compleix: mesurat el 2 de setembre de 2026,
    # aquest workflow declarava cada deu minuts i corria cada tres hores
    # llargues. El rellotge de debo es un cron trigger de Cloudflare que crida
    # workflow_dispatch -veure cloudflare/scheduler/worker.js-.
    #
    # Es queda posat, degradat a un cop per hora, per si aquell rellotge s'atura:
    # el token caduca, Cloudflare te un mal dia. Tornar a la cadencia mala es
    # molt millor que quedar-se sense cap.
    - cron: '20 * * * *'
  workflow_dispatch:

concurrency:
  group: avisos
  cancel-in-progress: false

jobs:
  ingesta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
      # Secret o variable, indiferent. Els dos calaixos de GitHub s'assemblen
      # prou perque un valor acabi al que no toca, i llavors l'expressio surt
      # buida: el worker es planta a l'arrencada i no diu per que. Va passar.
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || vars.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || vars.R2_SECRET_ACCESS_KEY }}
      DATA_BASE_URL: ${{ secrets.DATA_BASE_URL || vars.DATA_BASE_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: npm run worker:warnings
